version: "3.9"
services:
  labinstru:
    image: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=labinstru
  device_server:
    image: device_server:1
    ports:
      - "5000:5000"
    links:
      - labinstru
    depedens_on:
      device_server:
        condition: 
  calendar_server:
    image: calendar_server:1
    ports:
      - "4000:4000"
    links:
      - labinstru