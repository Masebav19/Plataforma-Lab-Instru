services:
  minio:
    image: coollabsio/minio:latest
    container_name: local-minio
    ports:
      - "9000:9000"   # Puerto para la API de S3
      - "9001:9001"   # Puerto para el panel de administración web
    environment:
      MINIO_ROOT_USER: labredes
      MINIO_ROOT_PASSWORD: labredes2026
    command: server /data --console-address ":9001"
    networks:
      - redes_network
    volumes:
      - minio_data:/data
    restart: always
  redesDB:
    image: mysql:latest
    container_name: redesdb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: redesdb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - redes_network
    restart: always
  calendar_server:
    image: calendar_server:latest
    container_name: calendar_server
    ports:
      - "4000:4000"
    environment:
      SQL_URL: "mysql://root:redesdb@172.31.36.74:3306"
      EMAIL_PASSWORD: "vusi gvow bzed jvqh"
      PRIMARY_EMAIL_TO: "mateo.vasquez@epn.edu.ec"
      PRIMARY_EMAIL_FROM: "lab.instrumentacion.epn@gmail.com"
      SECUNDARY_EMAIL_TO: "silvana.gamboa@epn.edu.ec"
      SERVICE: "gmail"
      MINIO_IP: "local-minio"
      BUCKET_NAME: "redes"
      JWT_SECRET: "DNSf9e19pIGzhZNaRshMysCBiIfYXerBsUb0bnah4U+P5Nnc1zD86tTw2wYRQ0HZ/lekkmurHpxiGzhXhQ2PQg=="
      APP_URL: "https://172.31.36.74:5174"
      SERVER_DEVICE: "http://172.31.36.74:5000"
      TZ: America/Guayaquil
    networks:
      - redes_network
    restart: always
  device_server:
    image: device_server:latest
    container_name: device_server
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "mysql://root:redesdb@172.31.36.74:3306/deviceDB"
      VITE_SERVER_PORT: 5000
      EMAIL_PASSWORD: "vusi gvow bzed jvqh"
      PRIMARY_EMAIL_TO: "mateo.vasquez@epn.edu.ec"
      PRIMARY_EMAIL_FROM: "lab.instrumentacion.epn@gmail.com"
      SERVICE: "gmail"
      TZ: America/Guayaquil
    networks:
      - redes_network
    depends_on:
      - redesDB
    restart: always
  calendar_app:
    image: calendar_app
    ports:
      - "5174:5174"
    networks:
      - redes_network
    restart: always
  home_app:
    image: home_app
    ports:
      - "5176:5176"
    networks:
      - redes_network
    restart: always
  device_app:
    image: device_app
    ports:
      - "5173:5173"
    networks:
      - redes_network
    restart: always

volumes:
  minio_data:
  mysql_data:
networks:
  redes_network: