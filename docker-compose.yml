services:
  minio:
    image: coollabsio/minio:latest
    container_name: local-minio
    ports:
      - "9000:9000"   # Puerto para la API de S3
      - "9001:9001"   # Puerto para el panel de administración web
    environment:
      MINIO_ROOT_USER: labinstru
      MINIO_ROOT_PASSWORD: labinstru2026
    command: server /data --console-address ":9001"
    networks:
      - instru_network
    volumes:
      - minio_data:/data
    restart: always
  testinstru:
    image: mysql:latest
    container_name: testinstru
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: testinstru
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - instru_network
    restart: always
  calendar_server:
    image: calendar_server:latest
    container_name: calendar_server
    ports:
      - "4000:4000"
    environment:
      SQL_URL: ""
      EMAIL_PASSWORD: ""
      PRIMARY_EMAIL_TO: ""
      PRIMARY_EMAIL_FROM: ""
      SECUNDARY_EMAIL_TO: ""
      SERVICE: ""
      MINIO_IP: ""
      BUCKET_NAME: ""
      JWT_SECRET: ""
      APP_URL: "https://172.29.72.132"
      SERVER_DEVICE: "http://172.29.72.132:5000"
      TZ: America/Guayaquil
    networks:
      - instru_network
    restart: always
  device_server:
    image: device_server:latest
    container_name: device_server
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: ""
      VITE_SERVER_PORT: 5000
      EMAIL_PASSWORD: ""
      PRIMARY_EMAIL_TO: ""
      PRIMARY_EMAIL_FROM: ""
      SERVICE: ""
      TZ: America/Guayaquil
    networks:
      - instru_network
    depends_on:
      - testinstru
    restart: always
  calendar_app:
    image: calendar_app
    ports:
      - "5174:5174"
    networks:
      - instru_network
    restart: always
  home_app:
    image: home_app
    ports:
      - "5176:5176"
    networks:
      - instru_network
    restart: always
  device_app:
    image: device_app
    ports:
      - "5173:5173"
    networks:
      - instru_network
    restart: always
  labinstruapp:
    build: ./deploy
    ports:
      - "443:443"
    networks:
      - instru_network
    restart: always
    volumes:
      - ./deploy/certs:/app/certs:ro

volumes:
  minio_data:
  mysql_data:
networks:
  instru_network:
