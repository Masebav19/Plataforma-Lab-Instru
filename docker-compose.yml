services:
  minio:
    image: coollabsio/minio:latest
    container_name: local-minio
    ports:
      - "9000:9000"   # Puerto para la API de S3
      - "9001:9001"   # Puerto para el panel de administración web
    environment:
    command: server /data --console-address ":9001"
    networks:
      - redes_network
    volumes:
      - minio_data:/data
    restart: always
  redesDB:
    image: mysql:latest
    container_name: redesdb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: redesdb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - redes_network
    restart: always
  calendar_server:
    image: calendar_server:latest
    container_name: calendar_server
    ports:
      - "4000:4000"
    environment:
    
    networks:
      - redes_network
    restart: always
  device_server:
    image: device_server:latest
    container_name: device_server
    ports:
      - "5000:5000"
    environment:
      
    networks:
      - redes_network
    depends_on:
      - redesDB
    restart: always
  calendar_app:
    image: calendar_app
    ports:
      - "5174:5174"
    networks:
      - redes_network
    restart: always
  home_app:
    image: home_app
    ports:
      - "5176:5176"
    networks:
      - redes_network
    restart: always
  device_app:
    image: device_app
    ports:
      - "5173:5173"
    networks:
      - redes_network
    restart: always
  labredeapp:
    image: labredeapp
    ports:
      - "443:443"
    networks:
      - redes_network
    restart: always
    volumes:
      - ./deploytest/certs:/app/certs:ro

volumes:
  minio_data:
  mysql_data:
networks:
  redes_network: